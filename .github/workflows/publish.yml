# v1.2.3 형태의 태그를 push 하면 GitHub Release 를 만들고 Open VSX, VS Code Marketplace 에 배포한다.
# 다른 방법으로 이미 올린 버전으로 다시 실행하려면 Actions 탭 → Publish → Run workflow 에서 태그를 고른다.
#
# - VS Code Marketplace: Trusted Publishing(OIDC). marketplace.visualstudio.com/manage → publisher → Trusted Publishing 에
#   이 저장소와 워크플로(publish.yml)를 등록해야 한다. 저장소 Secret VSCE_PAT 가 있으면 그것을 대신 쓴다.
# - Open VSX: 저장소 Secret OVSX_PAT. 없으면 건너뛴다.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # VS Code Marketplace Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # 단계의 if 에서 읽을 수 있도록 job 수준에 둔다
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 태그와 package.json 버전 확인
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($PKG_VERSION)이 다릅니다"
            exit 1
          fi

      - name: 패키징 (타입 검사 + 테스트 포함)
        run: npm run package

      # 같은 태그로 다시 실행하면 기존 Release 의 .vsix 만 교체한다
      - name: GitHub Release 생성
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "CHANGELOG.md 를 참고하세요."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 이미 올라간 버전이면 성공으로 넘어간다 (--skip-duplicate)
      - name: Open VSX 배포 (Cursor, Kiro 등)
        if: env.OVSX_PAT != ''
        run: |
          # 첫 배포라면 namespace(= publisher)를 만든다. 이미 있으면 실패해도 무시
          npx ovsx create-namespace "$(node -p "require('./package.json').publisher")" || true
          npx ovsx publish *.vsix --skip-duplicate

      - name: VS Code Marketplace 배포
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath *.vsix --skip-duplicate
          else
            npx vsce publish --packagePath *.vsix --skip-duplicate --oidc
          fi
